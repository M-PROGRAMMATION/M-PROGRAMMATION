<svg xmlns="http://www.w3.org/2000/svg" viewBox="350 118 446 250" width="892" height="500">
<style>
path { fill:#111; stroke:#111; }
@media (prefers-color-scheme: dark) { path { fill:#f5f5f5; stroke:#f5f5f5; } }
.m {
  fill-opacity:0; stroke-width:1.6; stroke-linejoin:round;
  stroke-dasharray:1; stroke-dashoffset:1;
  animation: draw 1.3s ease forwards, mfill .8s ease forwards;
}
.m1 { animation-delay:.1s,.95s }
.m2 { animation-delay:.35s,1.1s }
.m3 { animation-delay:.6s,1.25s }
.ltr { stroke:none; opacity:0; transform:translateY(16px);
  animation: rise .55s cubic-bezier(.2,.7,.3,1) forwards; }
.l1 { animation-delay:1.35s } .l2 { animation-delay:1.5s } .l3 { animation-delay:1.65s }
.tag { stroke:none; opacity:0; animation: pop .3s ease forwards; }
.bang { animation: pop .3s ease forwards, wink 4s ease-in-out infinite; }
@keyframes draw { to { stroke-dashoffset:0 } }
@keyframes mfill { to { fill-opacity:1 } }
@keyframes rise { to { opacity:1; transform:translateY(0) } }
@keyframes pop { to { opacity:1 } }
@keyframes wink { 0%,100% { opacity:1 } 6% { opacity:.15 } 12% { opacity:1 } }
</style>
